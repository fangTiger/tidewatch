[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tidewatch"
version = "0.1.0"
description = "观潮：个人市场监控系统"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<0.29",
  "websockets>=15.0,<18",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "sse-starlette>=2.1,<4",
  "jinja2>=3.1,<4",
  "sqlalchemy[asyncio]>=2.0.30,<2.2",
  "asyncpg>=0.29,<1",
  "alembic>=1.13,<2",
  "pydantic>=2.7,<3",
  "pyyaml>=6.0,<7",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10", "pytest-asyncio>=0.24,<2", "respx>=0.22,<0.24"]

[tool.hatch.build.targets.wheel]
packages = ["tidewatch"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
