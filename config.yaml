# 观潮默认配置（公开提交）。个人配置写在 config.local.yaml，密钥写在 .env
proxy_url: null  # 在 config.local.yaml 中设置，例如 http://127.0.0.1:10808

hyperliquid:
  enabled: true
  proxy: global
  rest_url: https://api.hyperliquid.xyz/info
  ws_url: wss://api.hyperliquid.xyz/ws
  leaderboard_url: https://stats-data.hyperliquid.xyz/Mainnet/leaderboard
  aliases_url: https://api.hypurrscan.io/globalAliases
  monitor_budget_per_min: 900
  batch_budget_per_min: 300
  reconcile_concurrency: 8
  frequencies:
    ws_ping_interval_s: 50
    core_state_interval_s: 5
    trade_debounce_s: 3
    hot_reconcile_interval_s: 20
    focus_reconcile_interval_s: 180
    fill_query_min_interval_s: 60
    account_type_cache_s: 3600
    fill_timeout_warning_interval_s: 1800
    leaderboard_interval_s: 43200
    tier_recompute_interval_s: 86400
    profile_interval_s: 86400
    label_refresh_interval_s: 86400
    discovery_window_s: 3
    discovery_cache_s: 3600
  tiers:
    core_limit: 10
    focus_limit: 200
    candidate_limit: 1000
    hot_limit: 30
  events:
    cluster_window_s: 1800
    max_push_age_s: 600
    s_level_notional_usd: 50000000
    a_level_notional_usd: 5000000
    btc_eth_min_notional_usd: 1000000
    top_alt_min_notional_usd: 500000
    other_min_notional_usd: 250000
    position_change_ratio: 0.2
    discovery_trade_notional_usd: 5000000
    discovery_account_value_usd: 1000000
    hot_position_notional_usd: 10000000
    hot_liquidation_distance_ratio: 0.1
    liquidation_risk_ratio: 0.05
    liquidation_critical_ratio: 0.02
    liquidation_hysteresis_ratio: 0.01
    liquidated_a_level_notional_usd: 5000000
    configured_leverage_threshold: 20
    actual_leverage_threshold: 10
  # 活跃 HIP-3 dex 白名单；M4 元数据来源接入前由本地配置维护。
  hip3_dexes: []
  top_altcoins: [SOL, XRP, HYPE, DOGE, BNB]
  ticker_symbols: [BTC, ETH, SOL, HYPE]
  core_wallets: []
  # 官方 vaultDetails 于 2026-10-06 返回的 HLP 父金库及子金库；上游调整时可在本地覆盖。
  protocol_excluded_addresses:
    - "0xdfc24b077bc1425ad1dea75bcb6f8158e10df303"
    - "0x010461c14e146ac35fe42271bdc1134ee31c703a"
    - "0x2e3d94f0562703b25c83308a05046ddaf9a8dd14"
    - "0x2ed5c4484ea3ff8b57d5f2fb152a40d9f2b68308"
    - "0x31ca8395cf837de08b24da3f660e77761dfb974b"
    - "0x469f690213c467c39a23efacfd2816896009d7d8"
    - "0x5e177e5e39c0f4e421f5865a6d8beed8d921cb70"
    - "0xb0a55f13d22f66e6d495ac98113841b2326e9540"
  health:
    hl_rest: {stale_after_s: 600}
    hl_trades_ws: {stale_after_s: 180}
    hl_core_ws: {stale_after_s: 180}
    hl_leaderboard: {stale_after_s: 50400}
    hl_profile: {stale_after_s: 100800}

watchlist:
  assets:
    - {symbol: BTC, aliases: [比特币, Bitcoin]}
    - {symbol: ETH, aliases: [以太坊, Ethereum]}
    - {symbol: SOL, aliases: [Solana]}
    - {symbol: XRP, aliases: [瑞波, Ripple]}
    - {symbol: HYPE, aliases: [Hyperliquid]}
    - {symbol: MSTR, aliases: [微策略, MicroStrategy]}
    - {symbol: COIN, aliases: [Coinbase]}
    - {symbol: NVDA, aliases: [英伟达, NVIDIA, Nvidia]}
    - {symbol: TSLA, aliases: [特斯拉, Tesla]}
    - {symbol: NDX, aliases: [纳指, 纳斯达克, Nasdaq]}
    - {symbol: SPX, aliases: [标普, S&P 500]}

collectors:
  jin10:
    interval_s: 20
    proxy: direct
    stale_after_s: 300
    backfill_max_s: 21600
    max_push_age_s: 1800
    rate_per_s: 2
  binance_ann:
    interval_s: 30          # 无 API Key 时的降级轮询间隔
    proxy: global
    stale_after_s: 180
    backfill_max_s: 21600
    max_push_age_s: 1800
    gap_fill_interval_s: 600
    rate_per_s: 1
  okx_ann:
    interval_s: 30
    proxy: global
    stale_after_s: 300
    backfill_max_s: 21600
    max_push_age_s: 1800
    rate_per_s: 1

rules:
  news:
    s_keywords:
      - {id: s.rate_decision, any: [利率决议, 议息会议, FOMC声明], none: [前瞻, 展望, 票委, 将于]}
      - {id: s.fed_rate, all: [美联储], any: [降息, 加息, 维持利率不变, 利率目标区间], none: [降息预期, 加息预期, 押注, 概率, 前瞻, 展望, 或将, 可能, 将于, 预计]}
      - {id: s.fed_chair, all: [美联储主席], any: [讲话, 表示, 证词, 新闻发布会]}
      - {id: s.cpi, all: [美国], any: [CPI], none: [前瞻, 展望, 预计, 将于]}
      - {id: s.pce, all: [美国], any: [PCE], none: [前瞻, 展望, 预计, 将于]}
      - {id: s.nfp, all: [美国], any: [非农], none: [前瞻, 展望, 预计, 将于]}
      - {id: s.emergency_rate, any: [紧急降息, 紧急加息]}
      - {id: s.tariff, all: [关税], any: [中国, 全面, 对等]}
      - {id: s.etf_approval, all: [ETF], any: [批准, 获批]}
      - {id: s.exchange_hack, any: [交易所被盗, 遭黑客攻击, 被黑客攻击]}
      - {id: s.depeg, any: [脱锚]}
      - {id: s.withdraw_halt, any: [暂停提现, 暂停提币]}
      - {id: s.bankruptcy, all: [破产], any: [交易所, 加密, 比特币, 稳定币, 银行破产]}
    a_keywords:
      - {id: a.macro, any: [美联储, 央行, 降息, 加息, 关税, 制裁]}
      - {id: a.regulator, any: [SEC, 证监会]}
      - {id: a.etf, any: [ETF]}
      - {id: a.geo, any: [战争, 停火]}
      - {id: a.security, any: [黑客, 被盗]}
      - {id: a.bankruptcy, any: [破产]}
    people: [特朗普, 马斯克]
    critical_ids: [s.exchange_hack, s.depeg, s.withdraw_halt, s.bankruptcy, s.emergency_rate, s.etf_approval]
    noise_markers: [专属文章, 点击阅读, 点击查看, 欢迎前往, 今日重点关注, 盯盘神器, 财经日历]
  exchange:
    exchange_names: [币安, Binance, OKX, 欧易]
    listing_keywords: [上线, 上币, list, 下架, delist]

pipeline:
  cluster_window_s: 600
  title_similarity: 0.5

dispatch:
  a_window_s: 300
  a_window_max: 10
  digest_interval_s: 60
  retry_immediate: 3
  retry_interval_s: 60
  retry_max_s: 86400
  health_alert_interval_s: 3600

web:
  host: 127.0.0.1
  port: 8000
  timeline_limit: 200

ai:
  enabled: false

log:
  dir: log
  retention_days: 14
  level: INFO
